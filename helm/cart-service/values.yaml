replicaCount: 3

image:
  repository: 887793660251.dkr.ecr.eu-north-1.amazonaws.com/cart-service-repo
  pullPolicy: IfNotPresent
  tag: "1"

service:
  type: ClusterIP
  name: cart-service-node
  port: 8082

serviceAccount:
  create: false
  name: default

resources: 
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8082
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 8082
  initialDelaySeconds: 5
  periodSeconds: 15


autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

