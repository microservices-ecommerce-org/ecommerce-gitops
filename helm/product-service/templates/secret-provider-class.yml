{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}

spec:
  provider: {{ .Values.secrets.provider }}

  secretObjects:
    {{- toYaml .Values.secrets.secretObjects | nindent 4 }}

  parameters:
    region: {{ .Values.secrets.region | quote }}

    usePodIdentity: {{ .Values.secrets.usePodIdentity | quote }}

    objects: |
      - objectName: "{{ .Values.secrets.objectName }}"
        objectType: "{{ .Values.secrets.objectType }}"

        jmesPath:
          {{- toYaml .Values.secrets.jmesPath | nindent 10 }}
{{- end }}