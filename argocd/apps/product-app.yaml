apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: product-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/microservices-ecommerce-org/ecommerce-gitops
    targetRevision: main
    path: helm/product-service

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true